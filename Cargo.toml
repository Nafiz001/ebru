[workspace]
resolver = "3"
members = ["crates/marbling", "crates/server", "crates/wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
marbling = { path = "crates/marbling" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
# Ops carry f64s that every tray must read identically; parse them exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
debug = "line-tables-only"

# The ink simulation is hot numeric code; unoptimised it's an order of
# magnitude slower, which makes even development builds feel wrong.
[profile.dev.package.marbling]
opt-level = 3

# Likewise printing: filling paths, texturing a few million pixels and
# compressing them to PNG all happen in dependencies.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ebru-server]
opt-level = 2

[profile.release]
codegen-units = 4

[profile.release.package.ebru-wasm]
opt-level = "s"
